# 서버 포트 설정
server:
  port: 8080

# 로깅 설정  
logging:
  level:
    root: INFO
    com.example.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{15}) - %msg%n"

# Spring Data Redis 설정
spring:
  data:
    redis:
      host: localhost
      port: 6379
