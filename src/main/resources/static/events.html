<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 관리 시스템</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1, h2 {
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select, button {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            padding: 8px 16px;
            border: none;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            margin-top: 20px;
            justify-content: center;
        }
        
        .pagination li {
            margin: 0 5px;
        }
        
        .pagination button {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            padding: 8px 12px;
            cursor: pointer;
        }
        
        .pagination button.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .pagination button:hover:not(.active) {
            background-color: #ddd;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>이벤트 관리 시스템</h1>
        
        <!-- 이벤트 생성 섹션 -->
        <div class="form-section">
            <h2>새 이벤트 생성</h2>
            <div class="form-group">
                <label for="eventId">이벤트 ID</label>
                <input type="text" id="eventId" placeholder="이벤트 ID를 입력하세요">
            </div>
            <div class="form-group">
                <label for="eventName">이벤트 이름</label>
                <input type="text" id="eventName" placeholder="이벤트 이름을 입력하세요">
            </div>
            <div class="form-group">
                <label for="eventQuantity">수량</label>
                <input type="number" id="eventQuantity" placeholder="수량을 입력하세요" min="1" value="100">
            </div>
            <button onclick="initializeEvent()">이벤트 생성</button>
            <div id="createStatus" class="status hidden"></div>
        </div>
        
        <!-- 이벤트 목록 섹션 -->
        <div class="form-section">
            <h2>이벤트 목록</h2>
            <div class="form-group">
                <label for="pageSize">페이지 크기</label>
                <select id="pageSize" onchange="loadEvents()">
                    <option value="5">5개씩 보기</option>
                    <option value="10" selected>10개씩 보기</option>
                    <option value="20">20개씩 보기</option>
                </select>
                
                <label for="sortBy">정렬 기준</label>
                <select id="sortBy" onchange="loadEvents()">
                    <option value="id">ID</option>
                    <option value="name">이름</option>
                    <option value="totalQuantity">총 수량</option>
                    <option value="remainingQuantity">남은 수량</option>
                    <option value="startTime">시작 시간</option>
                    <option value="endTime">종료 시간</option>
                </select>
                
                <label for="sortDirection">정렬 방향</label>
                <select id="sortDirection" onchange="loadEvents()">
                    <option value="ASC">오름차순</option>
                    <option value="DESC" selected>내림차순</option>
                </select>
            </div>
            
            <button onclick="loadEvents()">이벤트 목록 새로고침</button>
            
            <table id="eventsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>설명</th>
                        <th>총 수량</th>
                        <th>남은 수량</th>
                        <th>시작 시간</th>
                        <th>종료 시간</th>
                        <th>상태</th>
                        <th>액션</th>
                    </tr>
                </thead>
                <tbody id="eventsTableBody">
                    <!-- 이벤트 목록이 여기에 로드됩니다 -->
                </tbody>
            </table>
            
            <ul class="pagination" id="pagination">
                <!-- 페이지네이션 버튼이 여기에 로드됩니다 -->
            </ul>
        </div>
        
        <!-- 이벤트 참여 섹션 -->
        <div class="form-section">
            <h2>이벤트 참여</h2>
            <div class="form-group">
                <label for="participateEventId">이벤트 ID</label>
                <input type="text" id="participateEventId" placeholder="이벤트 ID를 입력하세요">
            </div>
            <div class="form-group">
                <label for="userId">사용자 ID</label>
                <input type="text" id="userId" placeholder="사용자 ID를 입력하세요">
            </div>
            <div class="form-group">
                <label for="lockType">락 타입</label>
                <select id="lockType">
                    <option value="spinlock">스핀락</option>
                    <option value="lualock">Lua 스크립트 락</option>
                    <option value="redisson">Redisson 락</option>
                    <option value="incr">INCR (락 없음)</option>
                </select>
            </div>
            <button onclick="participateEvent()">이벤트 참여</button>
            <div id="participateStatus" class="status hidden"></div>
        </div>
        
        <!-- 이벤트 상태 조회 섹션 -->
        <div class="form-section">
            <h2>이벤트 상태 조회</h2>
            <div class="form-group">
                <label for="statusEventId">이벤트 ID</label>
                <input type="text" id="statusEventId" placeholder="이벤트 ID를 입력하세요">
            </div>
            <button onclick="getEventStatus()">상태 조회</button>
            <div id="eventStatusResult" class="status hidden"></div>
        </div>
        
        <!-- 동시 요청 시뮬레이션 섹션 -->
        <div class="form-section">
            <h2>동시 요청 시뮬레이션</h2>
            <div class="form-group">
                <label for="simulateEventId">이벤트 ID</label>
                <input type="text" id="simulateEventId" placeholder="이벤트 ID를 입력하세요">
            </div>
            <div class="form-group">
                <label for="concurrentUsers">동시 요청 수</label>
                <input type="number" id="concurrentUsers" min="1" max="1000" value="100">
            </div>
            <div class="form-group">
                <label for="simulateLockType">락 타입</label>
                <select id="simulateLockType">
                    <option value="spinlock">스핀락</option>
                    <option value="lualock">Lua 스크립트 락</option>
                    <option value="redisson">Redisson 락</option>
                    <option value="incr">INCR (락 없음)</option>
                </select>
            </div>
            <button onclick="simulateConcurrentRequests()">시뮬레이션 시작</button>
            <div id="simulateStatus" class="status hidden"></div>
        </div>
    </div>
    
    <script>
        // 현재 페이지 상태
        let currentPage = 0;
        let totalPages = 0;
        const baseUrl = '/api/events';
        
        // 페이지 로드 시 이벤트 목록 로드
        window.onload = function() {
            loadEvents();
        };
        
        // 이벤트 생성 함수
        function initializeEvent() {
            const eventId = document.getElementById('eventId').value;
            const eventName = document.getElementById('eventName').value;
            const quantity = document.getElementById('eventQuantity').value;
            
            if (!eventId) {
                showStatus('createStatus', '이벤트 ID를 입력해주세요.', false);
                return;
            }
            
            fetch(`${baseUrl}/init/${eventId}?name=${encodeURIComponent(eventName)}&quantity=${quantity}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                showStatus('createStatus', `이벤트가 생성되었습니다: ${data.name} (수량: ${data.quantity})`, true);
                loadEvents(); // 목록 새로고침
            })
            .catch(error => {
                showStatus('createStatus', `오류 발생: ${error}`, false);
            });
        }
        
        // 이벤트 목록 로드 함수
        function loadEvents() {
            const page = currentPage;
            const size = document.getElementById('pageSize').value;
            const sortBy = document.getElementById('sortBy').value;
            const direction = document.getElementById('sortDirection').value;
            
            fetch(`${baseUrl}?page=${page}&size=${size}&sortBy=${sortBy}&direction=${direction}`)
            .then(response => response.json())
            .then(data => {
                renderEventsList(data);
                renderPagination(data);
            })
            .catch(error => {
                console.error('이벤트 목록 로드 오류:', error);
            });
        }
        
        // 이벤트 목록 렌더링 함수
        function renderEventsList(data) {
            const tableBody = document.getElementById('eventsTableBody');
            tableBody.innerHTML = '';
            
            if (data.content.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="9" style="text-align: center;">이벤트가 없습니다.</td>';
                tableBody.appendChild(row);
                return;
            }
            
            data.content.forEach(event => {
                const row = document.createElement('tr');
                
                // 날짜 포맷팅 함수
                const formatDate = (dateStr) => {
                    if (!dateStr) return '-';
                    const date = new Date(dateStr);
                    return date.toLocaleString();
                };
                
                row.innerHTML = `
                    <td>${event.id}</td>
                    <td>${event.name}</td>
                    <td>${event.description || '-'}</td>
                    <td>${event.totalQuantity}</td>
                    <td>${event.remainingQuantity}</td>
                    <td>${formatDate(event.startTime)}</td>
                    <td>${formatDate(event.endTime)}</td>
                    <td>${event.active ? '활성' : '비활성'}</td>
                    <td>
                        <button onclick="getEventStatus('${event.id}')">상태 조회</button>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        // 페이지네이션 렌더링 함수
        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            totalPages = data.totalPages;
            
            // 이전 페이지 버튼
            const prevItem = document.createElement('li');
            const prevButton = document.createElement('button');
            prevButton.innerText = '이전';
            prevButton.disabled = data.first;
            prevButton.onclick = () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadEvents();
                }
            };
            prevItem.appendChild(prevButton);
            pagination.appendChild(prevItem);
            
            // 페이지 번호 버튼들
            const maxVisiblePages = 5;
            const startPage = Math.max(0, Math.min(currentPage - Math.floor(maxVisiblePages / 2), data.totalPages - maxVisiblePages));
            const endPage = Math.min(startPage + maxVisiblePages, data.totalPages);
            
            for (let i = startPage; i < endPage; i++) {
                const pageItem = document.createElement('li');
                const pageButton = document.createElement('button');
                pageButton.innerText = i + 1;
                if (i === currentPage) {
                    pageButton.classList.add('active');
                }
                pageButton.onclick = () => {
                    currentPage = i;
                    loadEvents();
                };
                pageItem.appendChild(pageButton);
                pagination.appendChild(pageItem);
            }
            
            // 다음 페이지 버튼
            const nextItem = document.createElement('li');
            const nextButton = document.createElement('button');
            nextButton.innerText = '다음';
            nextButton.disabled = data.last;
            nextButton.onclick = () => {
                if (currentPage < data.totalPages - 1) {
                    currentPage++;
                    loadEvents();
                }
            };
            nextItem.appendChild(nextButton);
            pagination.appendChild(nextItem);
        }
        
        // 이벤트 참여 함수
        function participateEvent() {
            const eventId = document.getElementById('participateEventId').value;
            const userId = document.getElementById('userId').value;
            const lockType = document.getElementById('lockType').value;
            
            if (!eventId) {
                showStatus('participateStatus', '이벤트 ID를 입력해주세요.', false);
                return;
            }
            
            fetch(`${baseUrl}/participate/${lockType}/${eventId}?userId=${userId || ''}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus('participateStatus', `참여 성공: ${data.message} (남은 수량: ${data.remainingQuantity})`, true);
                } else {
                    showStatus('participateStatus', `참여 실패: ${data.message}`, false);
                }
            })
            .catch(error => {
                showStatus('participateStatus', `오류 발생: ${error}`, false);
            });
        }
        
        // 이벤트 상태 조회 함수
        function getEventStatus(id) {
            const eventId = id || document.getElementById('statusEventId').value;
            
            if (!eventId) {
                showStatus('eventStatusResult', '이벤트 ID를 입력해주세요.', false);
                return;
            }
            
            fetch(`${baseUrl}/status/${eventId}`)
            .then(response => response.json())
            .then(data => {
                const statusMessage = `
                    이벤트 ID: ${data.eventId}<br>
                    남은 수량: ${data.remainingQuantity}<br>
                    성공 수: ${data.successCount || 0}<br>
                    실패 수: ${data.failCount || 0}
                `;
                showStatus('eventStatusResult', statusMessage, true);
            })
            .catch(error => {
                showStatus('eventStatusResult', `오류 발생: ${error}`, false);
            });
        }
        
        // 동시 요청 시뮬레이션 함수
        function simulateConcurrentRequests() {
            const eventId = document.getElementById('simulateEventId').value;
            const concurrentUsers = document.getElementById('concurrentUsers').value;
            const lockType = document.getElementById('simulateLockType').value;
            
            if (!eventId) {
                showStatus('simulateStatus', '이벤트 ID를 입력해주세요.', false);
                return;
            }
            
            showStatus('simulateStatus', '시뮬레이션 진행 중...', true);
            
            fetch(`${baseUrl}/simulate/${eventId}?concurrentUsers=${concurrentUsers}&lockType=${lockType}`)
            .then(response => response.json())
            .then(data => {
                const statusMessage = `
                    시뮬레이션 완료:<br>
                    이벤트 ID: ${data.eventId}<br>
                    동시 요청 수: ${data.concurrentUsers}<br>
                    락 타입: ${data.lockType}<br>
                    성공 수: ${data.successCount}<br>
                    실패 수: ${data.failCount}<br>
                    남은 수량: ${data.remainingQuantity}
                `;
                showStatus('simulateStatus', statusMessage, true);
            })
            .catch(error => {
                showStatus('simulateStatus', `오류 발생: ${error}`, false);
            });
        }
        
        // 상태 표시 헬퍼 함수
        function showStatus(elementId, message, isSuccess) {
            const statusElement = document.getElementById(elementId);
            statusElement.innerHTML = message;
            statusElement.classList.remove('hidden', 'success', 'error');
            statusElement.classList.add(isSuccess ? 'success' : 'error');
        }
    </script>
</body>
</html>
