
spring:
  main:
    allow-bean-definition-overriding: true

  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.data.redis: INFO
    org.springframework.cache: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
